  <text x="50" y="84" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">AM</text>
  <text x="78" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Alex Morgan</text>
  <!-- Nav items -->

  <text x="550" y="186" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">AM</text>
  <text x="600" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Alex Morgan</text>
  <text x="600" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Consultant &amp; Lead</text>

  <line x1="530" y1="218" x2="720" y2="218" stroke="#25213b" stroke-width="1" />
  
  <text x="535" y="240" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">8+ Yrs</text>
  <text x="535" y="252" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Experience</text>

  <text x="600" y="240" fill="#6366f1" font-family="system-ui, sans-serif" font-size="14" font-weight="800">30+ Apps</text>
  <text x="600" y="252" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Delivered</text>

  <text x="670" y="240" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">100%</text>
  <text x="670" y="252" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Satisfaction</text>

  <!-- Bottom: 3 Featured Project Case Cards -->
  <rect x="30" y="332" width="230" height="145" rx="10" fill="#13111c" stroke="#27233a" stroke-width="1" />
  <rect x="46" y="348" width="198" height="60" rx="6" fill="#1e1b2e" />
  <text x="46" y="425" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">FinTech Banking Dashboard</text>
  <text x="46" y="442" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Product Strategy &amp; Design</text>
  <text x="46" y="462" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">View Case Study →</text>

  <rect x="285" y="332" width="230" height="145" rx="10" fill="#13111c" stroke="#27233a" stroke-width="1" />
  <rect x="301" y="348" width="198" height="60" rx="6" fill="#1e1b2e" />
  <text x="301" y="425" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Health &amp; Wellness App</text>
  <text x="301" y="442" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Mobile UI &amp; Brand Systems</text>
  <text x="301" y="462" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">View Case Study →</text>

  <rect x="540" y="332" width="230" height="145" rx="10" fill="#13111c" stroke="#27233a" stroke-width="1" />
  <rect x="556" y="348" width="198" height="60" rx="6" fill="#1e1b2e" />
  <text x="556" y="425" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SaaS Analytics Platform</text>
  <text x="556" y="442" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Web App &amp; Design System</text>
  <text x="556" y="462" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">View Case Study →</text>

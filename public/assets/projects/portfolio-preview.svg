<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg_grad_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#12121a" />
    </linearGradient>
    <linearGradient id="avatar_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="card_grad_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#bg_grad_p)" />
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#27273a" stroke-width="2" />

  <!-- Browser Top Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#09090d" />
  <rect x="0" y="30" width="800" height="12" fill="#09090d" />
  <line x1="0" y1="42" x2="800" y2="42" stroke="#27273a" stroke-width="1.5" />

  <!-- Window Dots -->
  <circle cx="28" cy="21" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="46" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="64" cy="21" r="5" fill="#10b981" opacity="0.8" />

  <!-- Address URL Bar -->
  <rect x="160" y="9" width="480" height="24" rx="6" fill="#1e1b2e" opacity="0.8" stroke="#373059" stroke-width="1" />
  <circle cx="178" cy="21" r="3" fill="#818cf8" />
  <text x="190" y="25" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="500">https://alexmorgan.design</text>


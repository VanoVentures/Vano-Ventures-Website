  <rect x="30" y="116" width="740" height="200" rx="12" fill="url(#card_grad_p)" stroke="#312e81" stroke-width="1" />

  <!-- Left: Bio & Highlights -->
  <rect x="56" y="138" width="100" height="18" rx="9" fill="#312e81" stroke="#4338ca" stroke-width="1" />
  <text x="68" y="151" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">PRODUCT DESIGNER</text>

  <text x="56" y="190" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Designing digital systems</text>
  <text x="56" y="220" fill="#c084fc" font-family="system-ui, sans-serif" font-size="24" font-weight="800">that elevate modern brands.</text>

  <rect x="56" y="238" width="370" height="7" rx="3.5" fill="#64748b" opacity="0.7" />
  <rect x="56" y="250" width="290" height="7" rx="3.5" fill="#64748b" opacity="0.5" />

  <rect x="56" y="270" width="125" height="32" rx="6" fill="#6366f1" />
